<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>card</title>
<style>
  @page { margin: 0 }
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:#0e1116;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
    color:#e9edf3;-webkit-font-smoothing:antialiased;
  }
  .glow{
    position:absolute;left:-260px;top:-260px;width:960px;height:960px;border-radius:50%;
    background:radial-gradient(circle,rgba(91,155,255,.2),rgba(91,155,255,0) 62%);
  }
  /* posters sit fully inside the frame: nothing is cut, so nothing reads as a bug */
  .posters{
    position:absolute;right:36px;top:0;height:630px;
    display:flex;gap:26px;align-items:center;
  }
  .posters img{
    width:205px;height:307px;object-fit:cover;border-radius:9px;
    box-shadow:0 16px 34px rgba(0,0,0,.5);
    background:#1b212a;
  }
  .posters img:nth-child(1){transform:translateY(-34px) rotate(-1.2deg)}
  .posters img:nth-child(2){transform:translateY(24px) rotate(.8deg)}
  .posters img:nth-child(3){transform:translateY(-14px) rotate(-.6deg)}
  .text{position:absolute;left:72px;top:0;height:630px;display:flex;flex-direction:column;justify-content:center;width:400px}
  .kicker{
    align-self:flex-start;margin-bottom:20px;
    padding:7px 15px;border-radius:999px;border:1px solid #2b323b;
    font-size:18px;font-weight:500;letter-spacing:.16em;color:#a2adbd;
  }
  h1{margin:0;font-size:94px;line-height:1;letter-spacing:-.035em;font-weight:700}
  h1 em{font-style:normal;color:#5b9bff}
  p{margin:24px 0 0;font-size:25px;line-height:1.38;color:#a2adbd}
  .chips{display:flex;gap:9px;margin-top:32px}
  .chip{
    padding:10px 16px;border-radius:9px;background:#171c23;border:1px solid #2b323b;
    font-size:23px;font-variant-numeric:tabular-nums;color:#e9edf3;
  }
  .chip.on{background:#5b9bff;border-color:#5b9bff;color:#0b1220;font-weight:600}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="posters">
    <img src="https://www.athinorama.gr/Content/ImagesDatabase/p/600x900/crop/both/lmnts/events/cinema/1001980/Poster.jpg?quality=81&amp;404=default&amp;v=1">
    <img src="https://www.athinorama.gr/Content/ImagesDatabase/p/600x900/crop/both/lmnts/events/cinema/1000121/Poster.jpg?quality=81&amp;404=default&amp;v=1">
    <img src="https://www.athinorama.gr/Content/ImagesDatabase/p/600x900/crop/both/lmnts/events/cinema/1003730/Poster.jpg?quality=81&amp;404=default&amp;v=1">
  </div>
  <div class="text">
    <span class="kicker">ΑΘΗΝΑ</span>
    <h1>σινεμ<em>ά</em></h1>
    <p>Όλες οι προβολές σε 38 αίθουσες, με φίλτρα ώρας, περιοχής και είδους.</p>
    <div class="chips">
      <span class="chip">19:30</span>
      <span class="chip on">21:45</span>
      <span class="chip">23:10</span>
    </div>
  </div>
</body>
</html>
