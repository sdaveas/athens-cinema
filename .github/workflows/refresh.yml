name: refresh data

on:
  schedule:
    # athinorama rolls Thu->Wed and publishes the new week at 07:00 Athens
    # (verified: six consecutive weekly review posts, all Thu 07:00:00).
    # Scraping before that date just re-saves the old week.
    # 08:00 UTC = 10:00 Athens in winter (EET), 11:00 in summer (EEST).
    - cron: "0 8 * * 4"
    # noon Athens backup, if the first run lands early or dies
    - cron: "0 10 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape
        run: python3 fetch.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
