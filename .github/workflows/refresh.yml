name: refresh data

on:
  schedule:
    # athinorama rolls Thu->Wed and publishes the new week at 07:00 Athens
    # (verified: six consecutive weekly review posts, all Thu 07:00:00).
    # Scraping before that date just re-saves the old week.
    # 06:17 UTC = 08:17 Athens in winter (EET, UTC+2), 09:17 in summer (EEST, UTC+3):
    # one hour after the 07:00 roll in winter, two in summer.
    # off-minute on purpose: the top of the hour is when the scheduler queue is
    # most congested and drop-prone (github docs, "scheduled workflows running at
    # unexpected times")
    - cron: "17 6 * * 4"
    # 10:23 Athens follow-up, in case the first run lands early or dies
    - cron: "23 8 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape
        run: python3 fetch.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
